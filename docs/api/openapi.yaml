openapi: "3.1.0"
info:
  title: "API de Open Data"
  version: "1.0.6"
  description: |
    Backend de Open Data. Todas las rutas cuelgan de /api y responden el header API-Version con la versión del backend.

    Contrato generado desde las pruebas de contrato: cada operación, schema y ejemplo salió de ejecutar el endpoint real. No se edita a mano.

    ## Catálogo de errores

    Toda respuesta de error trae `codigo`: el front discrimina por ese campo, nunca por `mensajeParaUsuario`.

    | Código | HTTP | Mensaje por defecto | Cuándo ocurre |
    |---|---|---|---|
    | `ACCESS_TOKEN_INVALIDO` | 401 | Token de acceso personal inválido | El token de acceso personal del header `Authorization` no existe, fue desactivado o eliminado |
    | `ARCHIVO_DEMASIADO_GRANDE` | 413 | El archivo supera el tamaño máximo permitido | Un archivo del request (o el request multipart completo) supera el tamaño máximo que acepta el servidor |
    | `BORRADO_LOGICO_TRANSICION_INVALIDA` | 400 | No se puede aplicar ese cambio de estado | Al guardar un registro con un `status` no permitido: reactivar (0) un registro eliminado (-1), o enviar un valor distinto de 0 y -1 |
    | `CODIGO_INVALIDO` | 400 | Código inválido | El código de verificación o de recuperación de contraseña enviado no coincide con el generado |
    | `CODIGO_VENCIDO` | 400 | El código ha expirado | El código de verificación o de recuperación de contraseña venció: hay que pedir uno nuevo |
    | `CODIGO_YA_UTILIZADO` | 400 | El código ya fue utilizado | El código de recuperación de contraseña ya fue usado: hay que pedir uno nuevo |
    | `CONFIGURACIONES_PRIVADAS` | 403 | No tenes permiso para ver estas variables | Se piden varias configuraciones y alguna es privada sin tener permiso para verlas. El mensaje nombra las configuraciones privadas |
    | `CREDENCIALES_INVALIDAS` | 401 | Usuario o contraseña incorrectos | Login con usuario o contraseña incorrectos. No distingue si el usuario no existe o si la contraseña no coincide |
    | `CUERPO_INVALIDO` | 400 | Error con los datos enviados | El body no se puede leer: JSON malformado, o un valor cuyo tipo no corresponde al del campo |
    | `CUIT_INVALIDO` | 400 | CUIT inválido | Al guardar una empresa o en el registro público de usuario y empresa, el CUIT no es válido (dígito verificador incorrecto) |
    | `DATOS_INCOMPLETOS` | 400 | Datos incompletos | Al body le falta un dato obligatorio del flujo de verificación, recuperación de contraseña o registro público (uuid, código, email o los datos de la empresa) |
    | `DEMASIADOS_INTENTOS` | 429 | Por favor espere unos minutos antes de reintentar | Se pidió un nuevo código de verificación o de recuperación antes de que termine el tiempo de espera desde el anterior |
    | `EMAIL_YA_REGISTRADO` | 400 | Email ya registrado | Al dar de alta un usuario, el email ya lo usa otro usuario activo o pendiente de verificación |
    | `ERROR_GENERANDO_EMAIL` | 500 | Error al generar el email | No se pudo armar el email de registro o de recuperación de contraseña. Es un error del backend |
    | `ERROR_INTERNO` | 500 | Error interno del servidor | Error inesperado del servidor, que no corresponde a ningún otro código. El `traceId` de la respuesta permite ubicarlo en los logs |
    | `FORMULARIO_INVALIDO` | 400 | Error en el formulario | El body no pasa las validaciones del DTO. `errores` trae un elemento por campo inválido, con su nombre y su mensaje |
    | `HOOK_NO_IMPLEMENTADO` | 500 | No implementado | El backend no tiene implementado el contenido del email del flujo (registro o recuperación de contraseña). Es un error de configuración del backend |
    | `LOGIN_NO_DISPONIBLE` | 400 | No está disponible este metodo de login | Login con usuario y contraseña cuando el backend no tiene habilitado el protocolo JWT |
    | `MEDIA_TYPE_NO_SOPORTADO` | 415 | Tipo de contenido no soportado | El endpoint no acepta el `Content-Type` del request |
    | `METODO_NO_SOPORTADO` | 405 | Metodo HTTP no soportado | El endpoint existe pero no acepta el método HTTP usado |
    | `NO_AUTENTICADO` | 401 | Usuario no identificado | La request no identifica a ningún usuario (no envió credenciales) y el endpoint exige sesión: hay que iniciar sesión |
    | `ORIGEN_NO_PERMITIDO` | 403 | Origen no permitido | El request se autentica con una cookie de sesión (`access_token` o `refresh_token`) y modifica datos (POST, PUT, PATCH o DELETE) desde un origen que no es el mismo host del backend ni está en `core.protocolo.cookie.origenes-permitidos`. Con el header `Authorization` no ocurre |
    | `PAGINADO_INVALIDO` | 400 | La consulta de paginado no es valida | La consulta de un paginado no se puede resolver: un campo de filtro u orden que no existe o no se puede filtrar, un operador inválido o un valor que no corresponde al tipo del campo |
    | `PREFIJO_DE_PROYECTO_EN_USO` | 400 | El prefijo ya lo usa otro proyecto. Elegí otro. | Al crear un proyecto, el prefijo ya lo usa otro proyecto, vigente o archivado. Hay que elegir otro |
    | `PREFIJO_DE_PROYECTO_NO_SE_CAMBIA` | 400 | El prefijo no se cambia: lo usan las claves de las tareas existentes. | Al editar un proyecto se mandó un prefijo distinto del actual: el prefijo no se cambia después de crear el proyecto |
    | `REFRESH_TOKEN_FALTANTE` | 400 | Refresh token is missing | El body de la renovación del token no trae el refresh token |
    | `REFRESH_TOKEN_INVALIDO` | 401 | Refresh token inválido o no encontrado | El refresh token enviado no existe, o su usuario no existe o está dado de baja: hay que volver a iniciar sesión |
    | `REFRESH_TOKEN_VENCIDO` | 401 | El refresh token ha expirado. Por favor inicie sesión nuevamente | El refresh token enviado venció: hay que volver a iniciar sesión |
    | `REGISTRO_NO_ENCONTRADO` | 400 | No existe el registro | El registro pedido (por el uuid del path u otro identificador del request) no existe o ya fue eliminado |
    | `RELACION_NO_ENCONTRADA` | 400 | No existe el registro relacionado indicado | Al guardar, el uuid de una relación (campo `{relacion}Uuid` del DTO) no corresponde a un registro vigente. `datos.campo` trae el nombre de ese campo |
    | `SERVICIO_DE_MAIL_NO_DISPONIBLE` | 500 | No se pueden enviar emails | El flujo necesita enviar un código por email y el backend no tiene el envío de emails habilitado |
    | `SIN_PERMISO` | 403 | No tenes permiso para realizar esta accion | El usuario autenticado no tiene el rol o permiso que exige el endpoint, o no puede operar sobre ese registro o esa empresa en particular |
    | `TOKEN_INVALIDO` | 401 | Token de acceso inválido | El access token HS256 del header `Authorization` no es válido (firma, tipo o usuario asociado). Un token con otro `alg` no es de este protocolo y no recibe este código |
    | `TOKEN_NOMBRE_DUPLICADO` | 400 | Ya existe un token con ese nombre | Al crear un token de acceso personal, el usuario ya tiene otro activo con el mismo nombre |
    | `TOKEN_REQUERIDO` | 401 | Token de acceso requerido | Al conectarse por WebSocket (frame STOMP `CONNECT`) sin el header `Authorization: Bearer {token}` o con el token vacío. Llega como frame `ERROR` de STOMP: hay que iniciar sesión y reconectar con el access token. Un endpoint HTTP sin token responde `NO_AUTENTICADO` |
    | `TOKEN_VENCIDO` | 401 | El token de acceso ha expirado. Por favor inicie sesión nuevamente | El access token del header `Authorization` venció: hay que renovarlo con el refresh token |
    | `USUARIO_NO_PENDIENTE_VERIFICACION` | 400 | El usuario no está pendiente de verificación | Se intenta verificar el código de un usuario que no está pendiente de verificación ni activo (por ejemplo, fue eliminado) |
servers:
- url: "/api"
tags:
- name: "AccessToken"
- name: "Configuracion"
- name: "JwtLogin"
- name: "Permiso"
- name: "Proyecto"
- name: "Rol"
- name: "TipoTablero"
- name: "TipoTarea"
- name: "Usuario"
paths:
  /configuracion/guardar:
    post:
      tags:
      - "Configuracion"
      operationId: "ConfiguracionController.guardar"
      summary: "Crea o edita configuraciones (busca cada una por su clave)"
      description: |-
        **Caso de uso:** CU-CON-04

        **Permiso:** `CONFIGURACION_CREAR`
      x-caso-de-uso: "CU-CON-04"
      x-permiso: "CONFIGURACION_CREAR"
      security:
      - bearer: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "array"
              items:
                $ref: "#/components/schemas/ConfiguracionGuardarRequestDTO"
            examples:
              valor-obligatorio:
                summary: "Valor obligatorio (SYSADMIN)"
                value:
                - global: true
                  nombre: "config.sin.valor"
                  valor: ""
              edita-una-existente-por-su-clave:
                summary: "Edita una existente por su clave (SYSADMIN)"
                value:
                - global: false
                  nombre: "demo.banner"
                  valor: "Otro banner"
              crea-una-configuracion-privada:
                summary: "Crea una configuracion privada (SYSADMIN)"
                value:
                - global: false
                  nombre: "config.privada.caso"
                  valor: "valor privado"
              crea-una-configuracion-publica:
                summary: "Crea una configuracion publica (SYSADMIN)"
                value:
                - global: true
                  nombre: "config.prueba"
                  valor: "valor de prueba"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ConfiguracionDTO"
              examples:
                edita-una-existente-por-su-clave:
                  summary: "Edita una existente por su clave (SYSADMIN)"
                  value:
                  - fechaDeCreacion: "2026-01-01T12:00:00.000-03:00"
                    global: false
                    nombre: "demo.banner"
                    status: 0
                    uuid: "90000000-0000-4000-8000-000000000003"
                    valor: "Otro banner"
                crea-una-configuracion-privada:
                  summary: "Crea una configuracion privada (SYSADMIN)"
                  value:
                  - fechaDeCreacion: "2026-01-01T12:00:00.000-03:00"
                    global: false
                    nombre: "config.privada.caso"
                    status: 0
                    uuid: "aaaaaaaa-aaaa-4aaa-8aaa-000000000001"
                    valor: "valor privado"
                crea-una-configuracion-publica:
                  summary: "Crea una configuracion publica (SYSADMIN)"
                  value:
                  - fechaDeCreacion: "2026-01-01T12:00:00.000-03:00"
                    global: true
                    nombre: "config.prueba"
                    status: 0
                    uuid: "aaaaaaaa-aaaa-4aaa-8aaa-000000000001"
                    valor: "valor de prueba"
        "400":
          description: "Errores: `FORMULARIO_INVALIDO`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                valor-obligatorio:
                  summary: "Valor obligatorio (SYSADMIN)"
                  value:
                    codigo: "FORMULARIO_INVALIDO"
                    errores:
                    - mensaje: "El valor de la configuracion es obligatorio"
                      nombre: "[0].valor"
                    fechaHora: "2026-01-01T12:00:00.000-03:00"
                    mensajeParaUsuario: "Error en el formulario"
                    status: "400 BAD_REQUEST"
                    traceId: "0000000000000000"
        "401":
          description: "Errores: `NO_AUTENTICADO`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                sin-autenticacion:
                  summary: "Sin autenticación"
                  value:
                    codigo: "NO_AUTENTICADO"
                    errores: []
                    fechaHora: "2026-01-01T12:00:00.000-03:00"
                    mensajeParaUsuario: "Usuario no identificado"
                    status: "401 UNAUTHORIZED"
                    traceId: "0000000000000000"
        "403":
          description: "Errores: `SIN_PERMISO`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                sin-permiso:
                  summary: "Sin permiso (CLIENTE)"
                  value:
                    codigo: "SIN_PERMISO"
                    errores: []
                    fechaHora: "2026-01-01T12:00:00.000-03:00"
                    mensajeParaUsuario: "No tienes permiso"
                    status: "403 FORBIDDEN"
                    traceId: "0000000000000000"
  /configuracion/listar:
    get:
      tags:
