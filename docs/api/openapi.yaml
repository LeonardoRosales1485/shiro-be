      operationId: "PermisoController.paginar"
      summary: "Lista los permisos del sistema con filtros y orden"
      description: |-
        **Caso de uso:** CU-PER-01

        **Permiso:** `PERMISO_VER`
      x-caso-de-uso: "CU-PER-01"
      x-permiso: "PERMISO_VER"
      security:
      - bearer: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoDePaginado"
            examples:
              paginar:
                summary: "Paginar (SYSADMIN)"
                value:
                  pagina: 1
                  tamano: 5
              filtra-por-nombre:
                summary: "Filtra por nombre (SYSADMIN)"
                value:
