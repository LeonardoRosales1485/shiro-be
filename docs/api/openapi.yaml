            examples:
              paginar:
                summary: "Paginar (SYSADMIN)"
                value:
                  filtros:
                  - - campo: "email"
                      operacion: "is not null"
                      valor: ""
                  pagina: 1
                  tamano: 5
              operacion-invalida:
                summary: "Operacion invalida (SYSADMIN)"
                value:
                  filtros:
                  - - campo: "nombreDeUsuario"
