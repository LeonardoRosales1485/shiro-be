      operationId: "ConfiguracionController.listar"
      summary: "Lista las configuraciones visibles para quien consulta"
      description: |-
        **Caso de uso:** CU-CON-01

        **Pública:** no requiere autenticación.
      x-caso-de-uso: "CU-CON-01"
      security: []
      parameters: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ConfiguracionDTO"
              examples:
                sin-sesion-solo-las-publicas:
                  summary: "Sin sesion solo las publicas"
                  value: []
                con-permiso-incluye-las-privadas:
                  summary: "Con permiso incluye las privadas (SYSADMIN)"
                  value:
                  - fechaDeCreacion: "2026-01-01T12:00:00.000-03:00"
                    global: false
                    nombre: "demo.banner"
                    status: 0
                    uuid: "90000000-0000-4000-8000-000000000003"
                    valor: "Ambiente demo con datos de ejemplo"
  /configuracion/obtener-varias:
    post:
      tags:
      - "Configuracion"
      operationId: "ConfiguracionController.obtenerVarias"
      summary: "Obtiene varias configuraciones por sus claves"
      description: |-
        **Caso de uso:** CU-CON-03

        **Pública:** no requiere autenticación.
      x-caso-de-uso: "CU-CON-03"
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "array"
              items:
                type: "string"
            examples:
              obtiene-una-por-clave:
                summary: "Obtiene una por clave (SYSADMIN)"
                value:
                - "demo.banner"
                - "config.prueba.lista"
              privada-sin-sesion:
                summary: "Privada sin sesion"
                value:
                - "demo.banner"
              publicas-sin-sesion:
                summary: "Publicas sin sesion"
                value:
                - "config.prueba.lista"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ConfiguracionDTO"
              examples:
                obtiene-una-por-clave:
                  summary: "Obtiene una por clave (SYSADMIN)"
                  value:
                  - fechaDeCreacion: "2026-01-01T12:00:00.000-03:00"
                    global: false
                    nombre: "demo.banner"
                    status: 0
                    uuid: "90000000-0000-4000-8000-000000000003"
                    valor: "Ambiente demo con datos de ejemplo"
                  - fechaDeCreacion: null
                    global: true
                    nombre: "config.prueba.lista"
                    status: 0
                    uuid: null
                    valor: null
                publicas-sin-sesion:
                  summary: "Publicas sin sesion"
                  value:
                  - fechaDeCreacion: null
                    global: true
                    nombre: "config.prueba.lista"
                    status: 0
                    uuid: null
                    valor: null
        "403":
          description: "Errores: `CONFIGURACIONES_PRIVADAS`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                privada-sin-sesion:
                  summary: "Privada sin sesion"
                  value:
                    codigo: "CONFIGURACIONES_PRIVADAS"
                    errores: []
                    fechaHora: "2026-01-01T12:00:00.000-03:00"
                    mensajeParaUsuario: "Las variables demo.banner son privadas"
                    status: "403 FORBIDDEN"
                    traceId: "0000000000000000"
  /configuracion/obtener/{clave}:
    get:
      tags:
      - "Configuracion"
      operationId: "ConfiguracionController.obtener"
      summary: "Obtiene una configuración por su clave"
      description: |-
        **Caso de uso:** CU-CON-02

        **Pública:** no requiere autenticación.
      x-caso-de-uso: "CU-CON-02"
      security: []
      parameters:
      - name: "clave"
        in: "path"
        required: true
        description: "Clave (nombre) de la configuración"
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfiguracionDTO"
              examples:
                obtiene-una-configuracion-privada-con-permiso:
                  summary: "Obtiene una configuracion privada con permiso (SYSADMIN)"
                  value:
                    fechaDeCreacion: "2026-01-01T12:00:00.000-03:00"
                    global: false
                    nombre: "demo.banner"
                    status: 0
                    uuid: "90000000-0000-4000-8000-000000000003"
                    valor: "Ambiente demo con datos de ejemplo"
                clave-inexistente-devuelve-una-publica-sin-valor:
                  summary: "Clave inexistente devuelve una publica sin valor"
                  value:
                    fechaDeCreacion: null
                    global: true
                    nombre: "clave-que-no-existe-00000000"
                    status: 0
                    uuid: null
                    valor: null
        "401":
          description: "Errores: `NO_AUTENTICADO`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                privada-sin-sesion:
                  summary: "Privada sin sesion"
                  value:
                    codigo: "NO_AUTENTICADO"
                    errores: []
                    fechaHora: "2026-01-01T12:00:00.000-03:00"
                    mensajeParaUsuario: "Usuario no identificado"
                    status: "401 UNAUTHORIZED"
                    traceId: "0000000000000000"
        "403":
          description: "Errores: `SIN_PERMISO`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                privada-sin-permiso:
                  summary: "Privada sin permiso (CLIENTE)"
                  value:
                    codigo: "SIN_PERMISO"
                    errores: []
                    fechaHora: "2026-01-01T12:00:00.000-03:00"
                    mensajeParaUsuario: "No tienes permiso"
                    status: "403 FORBIDDEN"
                    traceId: "0000000000000000"
  /permiso/paginar:
