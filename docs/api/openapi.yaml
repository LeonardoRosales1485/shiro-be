x-catalogo-de-errores:
- codigo: "ACCESS_TOKEN_INVALIDO"
  status: 401
  mensajePorDefecto: "Token de acceso personal inválido"
  cuando: "El token de acceso personal del header `Authorization` no existe, fue desactivado o eliminado"
  origen: "CodigoDeErrorApiKey"
- codigo: "ARCHIVO_DEMASIADO_GRANDE"
  status: 413
  mensajePorDefecto: "El archivo supera el tamaño máximo permitido"
  cuando: "Un archivo del request (o el request multipart completo) supera el tamaño máximo que acepta el servidor"
  origen: "CodigoDeErrorKernel"
- codigo: "BORRADO_LOGICO_TRANSICION_INVALIDA"
  status: 400
  mensajePorDefecto: "No se puede aplicar ese cambio de estado"
  cuando: "Al guardar un registro con un `status` no permitido: reactivar (0) un registro eliminado (-1), o enviar un valor distinto de 0 y -1"
  origen: "CodigoDeErrorKernel"
- codigo: "CAPTCHA_INVALIDO"
  status: 400
  mensajePorDefecto: "Verificación de Captcha fallida"
  cuando: "hCaptcha rechazó el token enviado, o no se pudo verificar con el servicio externo. Hay que resolver el captcha de nuevo"
  origen: "CodigoDeErrorCaptcha"
- codigo: "CAPTCHA_NO_COMPLETADO"
  status: 400
  mensajePorDefecto: "Captcha no completado"
  cuando: "La operación verifica un captcha y el request no trae el token de hCaptcha"
  origen: "CodigoDeErrorCaptcha"
- codigo: "CAPTCHA_NO_DISPONIBLE"
  status: 503
  mensajePorDefecto: "Faltan configuraciones necesarias para el servicio de captcha"
  cuando: "La operación verifica un captcha y el backend no tiene configurada la verificación de hCaptcha. Es un error de configuración del backend"
  origen: "CodigoDeErrorCaptcha"
- codigo: "CODIGO_INVALIDO"
  status: 400
  mensajePorDefecto: "Código inválido"
  cuando: "El código de verificación o de recuperación de contraseña enviado no coincide con el generado"
  origen: "CodigoDeErrorIdentity"
- codigo: "CODIGO_VENCIDO"
  status: 400
  mensajePorDefecto: "El código ha expirado"
  cuando: "El código de verificación o de recuperación de contraseña venció: hay que pedir uno nuevo"
  origen: "CodigoDeErrorIdentity"
- codigo: "CODIGO_YA_UTILIZADO"
  status: 400
  mensajePorDefecto: "El código ya fue utilizado"
  cuando: "El código de recuperación de contraseña ya fue usado: hay que pedir uno nuevo"
  origen: "CodigoDeErrorIdentity"
- codigo: "COMPANY_NO_ENCONTRADA"
  status: 400
  mensajePorDefecto: "Empresa no encontrada"
  cuando: "El uuid de empresa (del header `X-Empresa-Uuid` o del request) no corresponde a una empresa activa"
  origen: "CodigoDeErrorMultiempresa"
- codigo: "COMPANY_REQUERIDA"
  status: 400
  mensajePorDefecto: "Empresa requerida"
  cuando: "La operación necesita la empresa actual y el request no trae el header `X-Empresa-Uuid`"
  origen: "CodigoDeErrorMultiempresa"
- codigo: "CONFIGURACIONES_PRIVADAS"
  status: 403
  mensajePorDefecto: "No tenes permiso para ver estas variables"
  cuando: "Se piden varias configuraciones y alguna es privada sin tener permiso para verlas. El mensaje nombra las configuraciones privadas"
  origen: "CodigoDeErrorDelProyecto"
- codigo: "CONFIGURACION_DE_SISTEMA_INCOMPLETA"
  status: 500
  mensajePorDefecto: "Configuración incompleta"
  cuando: "En el registro público de usuario y empresa, falta en el sistema el rol ADMIN que se le asigna al usuario. Es un error de configuración del backend"
  origen: "CodigoDeErrorMultiempresa"
- codigo: "CONFIGURACION_INCOMPLETA"
  status: 400
  mensajePorDefecto: "Configuración incompleta"
  cuando: "En el registro público en una empresa, esa empresa no tiene configurado un rol por defecto para los usuarios nuevos"
  origen: "CodigoDeErrorMultiempresa"
- codigo: "CREDENCIALES_INVALIDAS"
  status: 401
  mensajePorDefecto: "Usuario o contraseña incorrectos"
  cuando: "Login con usuario o contraseña incorrectos. No distingue si el usuario no existe o si la contraseña no coincide"
  origen: "CodigoDeErrorIdentity"
- codigo: "CRYPTER_NO_DISPONIBLE"
  status: 503
  mensajePorDefecto: "Error con el servicio de archivos encriptados"
  cuando: "No se pudo guardar u obtener un archivo encriptado: el servicio externo de archivos no está configurado o no responde"
  origen: "CodigoDeErrorCrypter"
- codigo: "CUERPO_INVALIDO"
  status: 400
  mensajePorDefecto: "Error con los datos enviados"
  cuando: "El body no se puede leer: JSON malformado, o un valor cuyo tipo no corresponde al del campo"
  origen: "CodigoDeErrorKernel"
- codigo: "CUIT_INVALIDO"
  status: 400
  mensajePorDefecto: "CUIT inválido"
  cuando: "Al guardar una empresa o en el registro público de usuario y empresa, el CUIT no es válido (dígito verificador incorrecto)"
  origen: "CodigoDeErrorDelProyecto"
- codigo: "DATOS_INCOMPLETOS"
  status: 400
  mensajePorDefecto: "Datos incompletos"
  cuando: "Al body le falta un dato obligatorio del flujo de verificación, recuperación de contraseña o registro público (uuid, código, email o los datos de la empresa)"
  origen: "CodigoDeErrorIdentity"
- codigo: "DEMASIADOS_INTENTOS"
  status: 429
  mensajePorDefecto: "Por favor espere unos minutos antes de reintentar"
  cuando: "Se pidió un nuevo código de verificación o de recuperación antes de que termine el tiempo de espera desde el anterior"
  origen: "CodigoDeErrorIdentity"
- codigo: "EMAIL_YA_REGISTRADO"
  status: 400
  mensajePorDefecto: "Email ya registrado"
  cuando: "Al dar de alta un usuario, el email ya lo usa otro usuario activo o pendiente de verificación"
  origen: "CodigoDeErrorDelProyecto"
- codigo: "EMPRESA_DE_SISTEMA_NO_PERMITIDA"
  status: 400
  mensajePorDefecto: "No es posible registrarse en la empresa de sistema"
  cuando: "En el registro público de un cliente o al vincularse a una empresa, la empresa indicada en el header `X-Empresa-Uuid` es la de sistema, cuyos roles valen en todas las empresas: nadie entra a ella por esas vías, ni siquiera un SYSADMIN. Hay que elegir otra empresa"
  origen: "CodigoDeErrorMultiempresa"
- codigo: "EMPRESA_NO_PERMITIDA"
  status: 403
  mensajePorDefecto: "Empresa no permitida"
  cuando: "El usuario no pertenece a la empresa indicada en el header `X-Empresa-Uuid`"
  origen: "CodigoDeErrorMultiempresa"
- codigo: "ERROR_ELIMINANDO_ARCHIVO"
  status: 503
  mensajePorDefecto: "Error eliminando archivo en el servidor de imágenes"
  cuando: "Falló el borrado del archivo en el servidor de archivos públicos (SM3). Se puede reintentar"
  origen: "CodigoDeErrorSm3"
- codigo: "ERROR_GENERANDO_EMAIL"
  status: 500
  mensajePorDefecto: "Error al generar el email"
  cuando: "No se pudo armar el email de registro o de recuperación de contraseña. Es un error del backend"
  origen: "CodigoDeErrorDelProyecto"
- codigo: "ERROR_INTERNO"
  status: 500
  mensajePorDefecto: "Error interno del servidor"
  cuando: "Error inesperado del servidor, que no corresponde a ningún otro código. El `traceId` de la respuesta permite ubicarlo en los logs"
  origen: "CodigoDeErrorKernel"
- codigo: "ERROR_SUBIENDO_ARCHIVO"
  status: 503
  mensajePorDefecto: "Error subiendo archivo al servidor de imagenes"
  cuando: "Falló la subida del archivo al servidor de archivos públicos (SM3). Se puede reintentar"
  origen: "CodigoDeErrorSm3"
- codigo: "FORMULARIO_INVALIDO"
  status: 400
  mensajePorDefecto: "Error en el formulario"
  cuando: "El body no pasa las validaciones del DTO. `errores` trae un elemento por campo inválido, con su nombre y su mensaje"
  origen: "CodigoDeErrorKernel"
- codigo: "FUNCIONALIDAD_NO_IMPLEMENTADA"
  status: 501
  mensajePorDefecto: "Funcionalidad no implementada"
  cuando: "La operación necesita enviar un email y el backend está configurado con un medio de envío (notificaciones) que todavía no está implementado"
  origen: "CodigoDeErrorMail"
- codigo: "HOOK_NO_IMPLEMENTADO"
  status: 500
  mensajePorDefecto: "No implementado"
  cuando: "El backend no tiene implementado el contenido del email del flujo (registro o recuperación de contraseña). Es un error de configuración del backend"
  origen: "CodigoDeErrorIdentity"
- codigo: "LOGIN_NO_DISPONIBLE"
  status: 400
  mensajePorDefecto: "No está disponible este metodo de login"
  cuando: "Login con usuario y contraseña cuando el backend no tiene habilitado el protocolo JWT"
  origen: "CodigoDeErrorJwt"
- codigo: "MAIL_NO_DISPONIBLE"
  status: 503
  mensajePorDefecto: "Faltan configuraciones necesarias para el servicio de mail"
  cuando: "La operación necesita enviar un email y el backend no tiene configurado el servidor de correo"
  origen: "CodigoDeErrorMail"
- codigo: "MEDIA_TYPE_NO_SOPORTADO"
  status: 415
  mensajePorDefecto: "Tipo de contenido no soportado"
  cuando: "El endpoint no acepta el `Content-Type` del request"
  origen: "CodigoDeErrorKernel"
- codigo: "METODO_NO_SOPORTADO"
  status: 405
  mensajePorDefecto: "Metodo HTTP no soportado"
  cuando: "El endpoint existe pero no acepta el método HTTP usado"
  origen: "CodigoDeErrorKernel"
- codigo: "NO_AUTENTICADO"
  status: 401
  mensajePorDefecto: "Usuario no identificado"
  cuando: "La request no identifica a ningún usuario (no envió credenciales) y el endpoint exige sesión: hay que iniciar sesión"
  origen: "CodigoDeErrorKernel"
- codigo: "ORIGEN_NO_PERMITIDO"
  status: 403
  mensajePorDefecto: "Origen no permitido"
  cuando: "El request se autentica con una cookie de sesión (`access_token` o `refresh_token`) y modifica datos (POST, PUT, PATCH o DELETE) desde un origen que no es el mismo host del backend ni está en `core.protocolo.cookie.origenes-permitidos`. Con el header `Authorization` no ocurre"
  origen: "CodigoDeErrorIdentity"
- codigo: "PAGINADO_INVALIDO"
  status: 400
  mensajePorDefecto: "La consulta de paginado no es valida"
  cuando: "La consulta de un paginado no se puede resolver: un campo de filtro u orden que no existe o no se puede filtrar, un operador inválido o un valor que no corresponde al tipo del campo"
  origen: "CodigoDeErrorKernel"
- codigo: "REFRESH_TOKEN_FALTANTE"
  status: 400
  mensajePorDefecto: "Refresh token is missing"
  cuando: "El body de la renovación del token no trae el refresh token"
  origen: "CodigoDeErrorJwt"
- codigo: "REFRESH_TOKEN_INVALIDO"
  status: 401
  mensajePorDefecto: "Refresh token inválido o no encontrado"
  cuando: "El refresh token enviado no existe, o su usuario no existe o está dado de baja: hay que volver a iniciar sesión"
  origen: "CodigoDeErrorJwt"
- codigo: "REFRESH_TOKEN_VENCIDO"
  status: 401
  mensajePorDefecto: "El refresh token ha expirado. Por favor inicie sesión nuevamente"
  cuando: "El refresh token enviado venció: hay que volver a iniciar sesión"
  origen: "CodigoDeErrorJwt"
- codigo: "REGISTRO_NO_ENCONTRADO"
  status: 400
  mensajePorDefecto: "No existe el registro"
  cuando: "El registro pedido (por el uuid del path u otro identificador del request) no existe o ya fue eliminado"
  origen: "CodigoDeErrorCrud"
- codigo: "RELACION_NO_ENCONTRADA"
  status: 400
  mensajePorDefecto: "No existe el registro relacionado indicado"
  cuando: "Al guardar, el uuid de una relación (campo `{relacion}Uuid` del DTO) no corresponde a un registro vigente. `datos.campo` trae el nombre de ese campo"
  origen: "CodigoDeErrorCrud"
- codigo: "ROL_YA_EXISTE"
  status: 400
  mensajePorDefecto: "Ya existe un rol con ese nombre para su empresa"
  cuando: "Al guardar un rol, ya existe otro con el mismo nombre en la misma empresa"
  origen: "CodigoDeErrorMultiempresa"
- codigo: "SERVICIO_DE_MAIL_NO_DISPONIBLE"
  status: 500
  mensajePorDefecto: "No se pueden enviar emails"
  cuando: "El flujo necesita enviar un código por email y el backend no tiene el envío de emails habilitado"
  origen: "CodigoDeErrorIdentity"
- codigo: "SIN_PERMISO"
  status: 403
  mensajePorDefecto: "No tenes permiso para realizar esta accion"
  cuando: "El usuario autenticado no tiene el rol o permiso que exige el endpoint, o no puede operar sobre ese registro o esa empresa en particular"
  origen: "CodigoDeErrorKernel"
- codigo: "SM3_NO_DISPONIBLE"
  status: 503
  mensajePorDefecto: "Faltan configuraciones necesarias para el servicio SM3"
  cuando: "El backend no tiene configurado el servidor de archivos públicos (SM3). Es un error de configuración del backend"
  origen: "CodigoDeErrorSm3"
- codigo: "SSO_AUTENTICACION_FALLIDA"
  status: 401
  mensajePorDefecto: "No se pudo autenticar con el sistema de usuarios"
  cuando: "El servicio de SSO no reconoce el token del header `Authorization` (en Malvinas, solo un token ES256): hay que volver a iniciar sesión en el SSO"
  origen: "CodigoDeErrorSso"
- codigo: "SSO_CONTEXTO_NO_DISPONIBLE"
  status: 400
  mensajePorDefecto: "Contexto de petición no disponible"
  cuando: "La autenticación por SSO se ejecutó fuera de un request HTTP, sin un token para resolver"
  origen: "CodigoDeErrorSso"
- codigo: "SSO_INTEGRACION_ERROR"
  status: 503
  mensajePorDefecto: "Error en la comunicación con el sistema de usuarios"
  cuando: "Falló la comunicación con el servicio externo de SSO (no responde o responde con error). Se puede reintentar"
  origen: "CodigoDeErrorSso"
- codigo: "SSO_NO_DISPONIBLE"
  status: 503
  mensajePorDefecto: "Faltan configuraciones necesarias para el servicio SSO"
  cuando: "El backend no tiene configurado el servicio externo de SSO. Es un error de configuración del backend"
  origen: "CodigoDeErrorSso"
- codigo: "TOKEN_INVALIDO"
  status: 401
  mensajePorDefecto: "Token de acceso inválido"
  cuando: "El access token HS256 del header `Authorization` no es válido (firma, tipo o usuario asociado). Un token con otro `alg` no es de este protocolo y no recibe este código"
  origen: "CodigoDeErrorJwt"
- codigo: "TOKEN_NOMBRE_DUPLICADO"
  status: 400
  mensajePorDefecto: "Ya existe un token con ese nombre"
  cuando: "Al crear un token de acceso personal, el usuario ya tiene otro activo con el mismo nombre"
  origen: "CodigoDeErrorApiKey"
- codigo: "TOKEN_REQUERIDO"
  status: 401
  mensajePorDefecto: "Token de acceso requerido"
  cuando: "Al conectarse por WebSocket (frame STOMP `CONNECT`) sin el header `Authorization: Bearer {token}` o con el token vacío. Llega como frame `ERROR` de STOMP: hay que iniciar sesión y reconectar con el access token. Un endpoint HTTP sin token responde `NO_AUTENTICADO`"
  origen: "CodigoDeErrorJwt"
- codigo: "TOKEN_VENCIDO"
  status: 401
  mensajePorDefecto: "El token de acceso ha expirado. Por favor inicie sesión nuevamente"
  cuando: "El access token del header `Authorization` venció: hay que renovarlo con el refresh token"
  origen: "CodigoDeErrorJwt"
- codigo: "USUARIO_NO_PENDIENTE_VERIFICACION"
  status: 400
  mensajePorDefecto: "El usuario no está pendiente de verificación"
  cuando: "Se intenta verificar el código de un usuario que no está pendiente de verificación ni activo (por ejemplo, fue eliminado)"
  origen: "CodigoDeErrorIdentity"
