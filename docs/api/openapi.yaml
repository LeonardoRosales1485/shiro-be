      enum:
      - "DESCRIPCION"
      - "PRIORIDAD"
      - "ETIQUETAS"
      - "PUNTOS"
      - "RESPONSABLE"
      - "VERSIONES"
      - "COMENTARIOS"
      - "SUBTAREAS"
    DestinoDeCierre:
