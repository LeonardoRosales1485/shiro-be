<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperacion de contraseña</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f7fb;
      font-family:
        &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif;
      color: #0f2748;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f4f7fb; padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #d7e2ee;
              border-radius: 18px;
              overflow: hidden;
              box-shadow: 0 18px 40px rgba(15, 39, 72, 0.1);
            "
          >
            <tr>
              <td align="center" style="padding: 32px 24px 16px">
                <img
                  src="{urlDelFront}/assets/logo-empresa/logoBlueOpenData.png"
                  alt="Blue Open Data"
                  width="180"
                  style="
                    display: block;
                    width: 180px;
                    max-width: 100%;
                    height: auto;
                  "
                />
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 0 24px 8px">
                <h1
                  style="
                    margin: 0;
                    font-size: 28px;
                    line-height: 1.15;
                    color: #0d2347;
                    font-weight: 800;
                  "
                >
                  Blue Open Data
                </h1>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 0 24px 12px">
                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    line-height: 1.5;
                    color: #6b819d;
                  "
                >
                  Recuperacion segura de contrasena
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding: 0 24px 12px">
                <div
                  style="
                    border-radius: 16px;
                    border: 1px solid #d8e4f2;
                    background: linear-gradient(
                      180deg,
                      #f8fbff 0%,
                      #eef4fb 100%
                    );
                    padding: 24px;
                    text-align: center;
                  "
                >
                  <p
                    style="
                      margin: 0 0 10px;
                      font-size: 15px;
                      line-height: 1.6;
                      color: #4f6788;
                    "
                  >
                    Hola <strong style="color: #0d2347">{usuario}</strong>,
                  </p>
                  <p
                    style="
                      margin: 0 0 18px;
                      font-size: 15px;
                      line-height: 1.6;
                      color: #4f6788;
                    "
                  >
                    recibimos una solicitud para actualizar tu contrasena. Usa
                    el siguiente acceso para continuar con el cambio.
                  </p>

                  <a
                    href="{urlDelFront}/forgot-password?user={usuario}&code={codigo}&email={email}"
                    style="
                      display: inline-block;
                      padding: 14px 28px;
                      border-radius: 999px;
                      background-color: #3267d6;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 800;
                      font-size: 15px;
                    "
                  >
                    Valida!
                  </a>
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding: 0 24px 24px">
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    line-height: 1.55;
                    color: #6b819d;
                  "
                >
                  Si no solicitaste este cambio, podes ignorar este correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
