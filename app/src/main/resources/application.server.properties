# spring.mail.properties.mail.debug=true

# HCaptcha
# captcha.secreto=REMOVIDO
# captcha.habilitado=true
captcha.habilitado=false

# Actuator: GET /api/actuator/health (detras de nginx stg: /{path}/api/actuator/health; path en deploy.yml)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Multiempresa (modulo core-multiempresa)
core.multiempresa.habilitada=false
# Empresa cuyos roles valen en todas las empresas
# core.multiempresa.uuid-de-sistema=1
# core.multiempresa.nombre-de-sistema=Sistema
# Empresa operativa usada cuando multiempresa esta apagado
# core.multiempresa.uuid-por-defecto=2
core.multiempresa.nombre-por-defecto=Prueba Template

# Usuario inicial que crea core-identity al arrancar (sin estas dos propiedades no se crea)
core.identity.usuario-inicial.nombre-de-usuario=sysadmin
core.identity.usuario-inicial.contrasena=123

# Contrato de endpoint (openapi.yaml + Redoc) en /api/docs, sin autenticacion. En produccion va en false
# (CONTRATOS_PUBLICAR=false en deploy.yml) para no exponer el mapa de la API
contratos.publicar=${CONTRATOS_PUBLICAR:true}
