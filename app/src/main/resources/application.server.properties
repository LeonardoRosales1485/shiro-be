# Server (port y nombre del proyecto provienen de deploy.yml vía deploy.sh / docker-compose)
server.port=${SERVER_PORT}
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Driver y dialecto los define el docker-compose del stack (SPRING_DATASOURCE_DRIVER_CLASS_NAME, SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT)
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
logging.level.liquibase.database=WARN
logging.level.org.hibernate.orm.deprecation=ERROR

# Front: url general; las específicas vacías usan front.url
front.url=https://stg.blueopendata.com/NOMBRE_REMPLAZAR
# Correos registro/recuperación (vacío = front.url)
front.url.mail=
# CORS WebSocket, lista separada por comas (vacío = front.url)
front.url.websocket=https://stg.blueopendata.com/NOMBRE_REMPLAZAR,https://stg.blueopendata.com
# CORS: origenes del front (scheme://host[:puerto], sin path) separados por comas (vacío = origen de front.url)
front.url.cors=https://stg.blueopendata.com
# Sesión por cookie (Core 3.6.0): origenes desde los que se acepta la cookie en un request que modifica. Iguales al CORS
core.protocolo.cookie.origenes-permitidos=${front.url.cors}
# Path público de la cookie refresh_token cuando nginx publica el backend con prefijo (/{path}/api -> /{path}/api/usuario).
# Vacío = /api/usuario (nginx en /api)
core.protocolo.cookie.path-refresh-token=${CORE_PROTOCOLO_COOKIE_PATH_REFRESH_TOKEN:}

