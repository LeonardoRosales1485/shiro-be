# Port
server.port=PUERTO_REMPLAZAR

# PostgreSQL Config
spring.datasource.url=jdbc:postgresql://localhost:PUERTO_POSTGRES_REMPLAZAR/shiro
spring.datasource.username=shiro
spring.datasource.password=shiro

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Front: url general; las específicas vacías usan front.url
front.url=http://localhost:4200
# Correos registro/recuperación (vacío = front.url)
front.url.mail=
# CORS WebSocket, lista separada por comas (vacío = front.url)
front.url.websocket=http://localhost:4200,http://127.0.0.1:4200
# CORS: origenes del front (scheme://host[:puerto], sin path) separados por comas (vacío = origen de front.url)
front.url.cors=http://localhost:4200,http://127.0.0.1:4200
# Sesión por cookie (Core 3.6.0): origenes desde los que se acepta la cookie en un request que modifica. Iguales al CORS
core.protocolo.cookie.origenes-permitidos=${front.url.cors}
# Desarrollo local sin HTTPS: sin esto el navegador no guarda las cookies de sesión. Nunca en un ambiente servido
core.protocolo.cookie.secure=false

## Auth
jwt.secreto=REMOVIDO

# Protocolos de Shiro (spec, Spec 2): jwt (sesion web), basic (cuentas locales) y tokens (MCP).
# Google se agrega en F2 como estrategia propia de Shiro
auth.protocolos=jwt,basic,tokens
# Prefijo de /iniciar-sesion, /refresh-token (core-protocolo-jwt) y de los tokens personales (core-protocolo-apikey):
# el mismo que el @RequestMapping de UsuarioController
core.protocolo.jwt.ruta=usuario
core.protocolo.apikey.ruta=usuario


# Locate
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.locale=es_AR

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
spring.datasource.hikari.leak-detection-threshold=30000


logging.level.liquibase.database=WARN
logging.level.org.hibernate.orm.deprecation=ERROR

# Actuator: GET /api/actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.servlet.context-path=/api


# Usuario inicial que crea core-identity al arrancar (sin estas dos propiedades no se crea)
core.identity.usuario-inicial.nombre-de-usuario=sysadmin
core.identity.usuario-inicial.contrasena=123

# Servidor MCP (Spring AI, spec Spec 4): Streamable HTTP sin estado en /api/mcp. La autenticacion con el protocolo
# tokens llega en T3.1
spring.ai.mcp.server.name=shiro
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
