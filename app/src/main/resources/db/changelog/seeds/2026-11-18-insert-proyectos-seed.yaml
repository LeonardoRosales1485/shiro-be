# Seeds de proyectos (T1.2): Shiro (SHI) con sus cuatro tableros, para las pruebas y la demo, y un proyecto archivado
# (ARC) que muestra que el prefijo de un archivado queda reservado.
databaseChangeLog:
  - changeSet:
      id: 2026-11-18-insert-proyectos-seed-1
      author: shiro
      comment: "Crea el proyecto Shiro (SHI)"
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck: {expectedResult: 0, sql: "SELECT COUNT(*) FROM shr_proyecto WHERE uuid = 'b1000000-0000-4000-8000-000000000001'"}
      changes:
        - insert:
            tableName: shr_proyecto
            columns:
              - column: {name: uuid, value: b1000000-0000-4000-8000-000000000001}
              - column: {name: nombre, value: Shiro}
              - column: {name: prefijo, value: SHI}
              - column: {name: descripcion, value: "Gestor de trabajo de Blue Open Data"}
      rollback:
        - delete: {tableName: shr_proyecto, where: "uuid = 'b1000000-0000-4000-8000-000000000001'"}

  - changeSet:
      id: 2026-11-18-insert-proyectos-seed-2
      author: shiro
      comment: "Crea el tablero PRINCIPAL del proyecto Shiro"
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck: {expectedResult: 0, sql: "SELECT COUNT(*) FROM shr_tablero WHERE uuid = 'b2000000-0000-4000-8000-000000000001'"}
      changes:
        - insert:
            tableName: shr_tablero
            columns:
              - column: {name: uuid, value: b2000000-0000-4000-8000-000000000001}
              - column: {name: id_proyecto, valueComputed: "(SELECT id FROM shr_proyecto WHERE prefijo = 'SHI')"}
              - column: {name: id_tipo_tablero, valueComputed: "(SELECT id FROM shr_tipo_tablero WHERE codigo = 'PRINCIPAL')"}
      rollback:
        - delete: {tableName: shr_tablero, where: "uuid = 'b2000000-0000-4000-8000-000000000001'"}

