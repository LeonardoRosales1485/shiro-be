# Reemplaza a los seeds que nombraban la tabla auth_users, sus columnas en ingles (username, name, phone, password,
# verification_code, ...) o la tabla security_code, que core-identity renombra a auth_usuarios, nombre_de_usuario,
# nombre, telefono, contrasena, codigo_de_verificacion, ... y codigos_de_seguridad (glosario, ticket 06): en una base
# nueva ya no podian correr. Corre al final de los seeds, en el mismo orden relativo que los originales.
# 2026-10-09-insert-roles-seed-5 y -6 no nombran esas tablas, pero asignan roles a relaciones que crean los
# changesets reemplazados y tienen que correr despues. En las bases donde los originales ya corrieron, las filas
# existen y estos quedan MARK_RAN.
#
# Usuarios de ejemplo (clave de todos: 123):
# - demo: actor del rol ADMIN de las pruebas de contrato, con su empresa BlueOpenData, un codigo de seguridad, un
#   token de acceso y un refresh token JWT de ejemplo.
# - sysadmin-pruebas (rol SYSADMIN de la empresa de sistema) y cliente (rol CLIENTE, sin permisos, de BlueOpenData):
#   actores de las pruebas de contrato (ActoresDelProyecto en app/src/test), cada uno con su token de acceso
#   (protocolo tokens). cliente es el actor del caso automatico "sin permiso".
# - pendiente-verificacion y pendiente-vencido (status -2): para probar POST /usuario/publico/verificar con un codigo
#   conocido (ABC123), vigente y vencido (el registro publico genera un codigo nuevo en cada alta).
#
# Reemplazos (original -> nuevo):
# - 2026-07-06-insert-demo-seed-1 -> 2026-10-09-insert-usuarios-seed-1
# - 2026-07-06-insert-demo-seed-3 -> 2026-10-09-insert-usuarios-seed-2
# - 2026-07-06-insert-demo-seed-5 -> 2026-10-09-insert-usuarios-seed-3
# - 2026-07-06-insert-demo-seed-6 -> 2026-10-09-insert-usuarios-seed-4 -> 2026-10-09-insert-tokens-seed-1 (ticket 08)
# - 2026-07-06-insert-demo-seed-7 -> 2026-10-09-insert-usuarios-seed-5 -> 2026-10-09-insert-tokens-seed-2 (ticket 08)
# - 2026-10-08-insert-actores-de-prueba-seed-1 -> 2026-10-09-insert-usuarios-seed-6
# - 2026-10-08-insert-actores-de-prueba-seed-2 -> 2026-10-09-insert-usuarios-seed-7
# - 2026-10-08-insert-actores-de-prueba-seed-4 -> 2026-10-09-insert-usuarios-seed-8 -> 2026-10-09-insert-tokens-seed-3 (ticket 08)
# - 2026-10-08-insert-actores-de-prueba-seed-5 -> 2026-10-09-insert-usuarios-seed-9
# - 2026-10-08-insert-actores-de-prueba-seed-6 -> 2026-10-09-insert-usuarios-seed-10
# - 2026-10-08-insert-actores-de-prueba-seed-8 -> 2026-10-09-insert-usuarios-seed-11 -> 2026-10-09-insert-tokens-seed-4 (ticket 08)
# - 2026-10-08-insert-usuarios-pendientes-seed-1 -> 2026-10-09-insert-usuarios-seed-12
# - 2026-10-08-insert-usuarios-pendientes-seed-2 -> 2026-10-09-insert-usuarios-seed-13
# - 2026-10-09-insert-roles-seed-4 -> 2026-10-09-insert-usuarios-seed-14
# - 2026-10-09-insert-roles-seed-5 -> 2026-10-09-insert-usuarios-seed-15
# - 2026-10-09-insert-roles-seed-6 -> 2026-10-09-insert-usuarios-seed-16
#
# Los tokens de acceso y el refresh token de ejemplo (-4, -5, -8 y -11) se sacaron de este archivo: nombraban la
# tabla auth_user_access_tokens y las columnas name, code, active, user_id y expiry_date, que los protocolos
# renombran (glosario, ticket 08). Los reemplaza 2026-10-09-insert-tokens-seed.yaml.
#
# -2, -7, -10, -14, -15 y -16 (empresas de demo, sysadmin-pruebas y cliente y sus roles) se reemplazaron por
# 2026-10-09-insert-empresas-seed.yaml: nombraban las tablas auth_users_companies, auth_user_company_roles y
# companies, que el ticket 07 renombra.
databaseChangeLog:
  - changeSet:
      id: 2026-10-09-insert-usuarios-seed-1
      author: TaielMG
      comment: Crea usuario demo (usuario/clave 123)
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM auth_usuarios WHERE nombre_de_usuario = 'demo'
      changes:
        - insert:
            tableName: auth_usuarios
            columns:
              - column:
                  name: nombre_de_usuario
                  value: demo
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 90000000-0000-4000-8000-000000000002
              - column:
                  name: nombre
                  value: Usuario Demo
              - column:
                  name: email
                  value: demo@example.local
              - column:
                  name: telefono
                  value: '1122334455'
              - column:
                  name: nombre_de_departamento
                  value: Demostraciones
              - column:
                  name: nombre_de_grupo
                  value: demo
              - column:
                  name: contrasena
                  value: $2b$10$nNpiAqrVV8ISDrlK3S7gC.quo3MKQWltsUvdVQMZKT0luOLIKcPYq
      rollback:
        - delete:
            tableName: auth_usuarios
            where: uuid = '90000000-0000-4000-8000-000000000002'

  - changeSet:
