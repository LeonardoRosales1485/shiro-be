              - column:
                  name: codigo
                  value: '123456'
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 90000000-0000-4000-8000-000000000006
              - column:
                  name: proposito
                  value: DEMO_VERIFICATION
              - column:
                  name: usado
                  valueBoolean: false
              - column:
                  name: fecha_de_emision
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: id_usuario
                  valueComputed: (SELECT id FROM auth_usuarios WHERE nombre_de_usuario = 'demo')
      rollback:
        - delete:
            tableName: codigos_de_seguridad
            where: uuid = '90000000-0000-4000-8000-000000000006'

