  - changeSet:
      id: 2026-10-09-insert-empresas-seed-7
      author: TaielMG
      comment: Asigna el rol base ADMIN al usuario demo
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: >-
            SELECT COUNT(*) FROM auth_usuarios_empresas_roles uer
            JOIN auth_usuarios_empresas ue ON ue.id = uer.id_usuario_empresa
            JOIN auth_usuarios u ON u.id = ue.id_usuario
            JOIN auth_roles r ON r.id = uer.id_rol
            JOIN empresas re ON re.id = r.id_empresa
            WHERE u.nombre_de_usuario = 'demo' AND r.nombre = 'ADMIN' AND re.uuid = '1'
      changes:
        - insert:
            tableName: auth_usuarios_empresas_roles
            columns:
              - column:
                  name: id_usuario_empresa
                  valueComputed: >-
                    (SELECT ue.id FROM auth_usuarios_empresas ue
                     JOIN auth_usuarios u ON u.id = ue.id_usuario
                     WHERE u.nombre_de_usuario = 'demo')
              - column:
                  name: id_rol
                  valueComputed: >-
                    (SELECT r.id FROM auth_roles r
                     JOIN empresas e ON e.id = r.id_empresa
                     WHERE r.nombre = 'ADMIN' AND e.uuid = '1')
      rollback:
        - delete:
            tableName: auth_usuarios_empresas_roles
            where: >-
              id_usuario_empresa IN (
                SELECT ue.id FROM auth_usuarios_empresas ue
                JOIN auth_usuarios u ON u.id = ue.id_usuario
                WHERE u.nombre_de_usuario = 'demo'
              )
              AND id_rol IN (
                SELECT r.id FROM auth_roles r
                JOIN empresas e ON e.id = r.id_empresa
                WHERE r.nombre = 'ADMIN' AND e.uuid = '1'
              )

