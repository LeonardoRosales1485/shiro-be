      author: TaielMG
      comment: >-
        Crea el rol por defecto CLIENTE (sin permisos) de la empresa BlueOpenData. Lo usan
        publico/vincular y publico/registro-cliente, que asignan el rol por defecto de la empresa y
        desde Core 2.0.1 no permiten entrar a la empresa de sistema.
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM auth_roles WHERE uuid = '90000000-0000-4000-8000-000000000009'
      changes:
        - insert:
            tableName: auth_roles
            columns:
              - column:
                  name: nombre
                  value: CLIENTE
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 90000000-0000-4000-8000-000000000009
              - column:
                  name: por_defecto
                  valueNumeric: 1
              - column:
                  name: id_empresa
                  valueComputed: (SELECT id FROM empresas WHERE uuid = '2')
      rollback:
        - delete:
            tableName: auth_roles
            where: uuid = '90000000-0000-4000-8000-000000000009'

