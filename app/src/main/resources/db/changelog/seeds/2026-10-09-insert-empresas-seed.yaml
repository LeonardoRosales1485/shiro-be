# Reemplaza a los seeds que nombraban las tablas companies, auth_users_companies y auth_user_company_roles o sus
# columnas en ingles (user_id, company_id, user_company_role_id, role_id), que core-multiempresa renombra a empresas,
# auth_usuarios_empresas y auth_usuarios_empresas_roles (glosario, ticket 07): en una base nueva ya no podian correr.
# Corre al final de los seeds, en el mismo orden relativo que los originales: roles de las empresas, empresas de los
# usuarios de ejemplo y sus roles. En las bases donde los originales ya corrieron, las filas existen y estos quedan
# MARK_RAN.
#
# Los roles base SYSADMIN y ADMIN los crea al arrancar InicializadorDeBaseService, pero cuando el master y los seeds
# corren juntos (pruebas de contrato, core-test) Liquibase va antes y los seeds que asignan esos roles no los
# encontrarian. InicializadorDeBaseService reutiliza el rol existente (lo busca por nombre y empresa) y le sincroniza
# los permisos.
#
# Reemplazos (original -> nuevo). 2026-10-09-insert-roles-seed.yaml quedo sin changesets y se borro:
# - 2026-10-09-insert-roles-seed-1 -> 2026-10-09-insert-empresas-seed-1
# - 2026-10-09-insert-roles-seed-2 -> 2026-10-09-insert-empresas-seed-2
# - 2026-10-09-insert-roles-seed-3 -> 2026-10-09-insert-empresas-seed-3
# - 2026-10-09-insert-usuarios-seed-2 -> 2026-10-09-insert-empresas-seed-4
# - 2026-10-09-insert-usuarios-seed-7 -> 2026-10-09-insert-empresas-seed-5
# - 2026-10-09-insert-usuarios-seed-10 -> 2026-10-09-insert-empresas-seed-6
# - 2026-10-09-insert-usuarios-seed-14 -> 2026-10-09-insert-empresas-seed-7
# - 2026-10-09-insert-usuarios-seed-15 -> 2026-10-09-insert-empresas-seed-8
# - 2026-10-09-insert-usuarios-seed-16 -> 2026-10-09-insert-empresas-seed-9
databaseChangeLog:
  - changeSet:
      id: 2026-10-09-insert-empresas-seed-1
      author: TaielMG
      comment: Crea el rol SYSADMIN de la empresa de sistema si todavia no existe
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: >-
            SELECT COUNT(*) FROM auth_roles r JOIN empresas e ON e.id = r.id_empresa
            WHERE r.nombre = 'SYSADMIN' AND e.uuid = '1'
      changes:
        - insert:
            tableName: auth_roles
            columns:
              - column:
                  name: nombre
                  value: SYSADMIN
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 90000000-0000-4000-8000-000000000010
              - column:
                  name: por_defecto
                  valueNumeric: 0
              - column:
                  name: id_empresa
                  valueComputed: (SELECT id FROM empresas WHERE uuid = '1')
      rollback:
        - delete:
            tableName: auth_roles
            where: uuid = '90000000-0000-4000-8000-000000000010'

