            JOIN empresas e ON e.id = ue.id_empresa
            WHERE u.nombre_de_usuario = 'demo' AND e.uuid = '2'
      changes:
        - insert:
            tableName: auth_usuarios_empresas
            columns:
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 90000000-0000-4000-8000-000000000005
              - column:
                  name: id_usuario
                  valueComputed: (SELECT id FROM auth_usuarios WHERE nombre_de_usuario = 'demo')
              - column:
                  name: id_empresa
                  valueComputed: (SELECT id FROM empresas WHERE uuid = '2')
      rollback:
        - delete:
