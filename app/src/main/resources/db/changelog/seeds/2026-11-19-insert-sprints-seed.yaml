# Seeds de sprints (T5.2): Sprint 1 del proyecto Shiro, planificado y sin tareas.
databaseChangeLog:
  - changeSet:
      id: 2026-11-19-insert-sprints-seed-1
      author: shiro
      comment: "Crea el Sprint 1 del proyecto Shiro"
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck: {expectedResult: 0, sql: "SELECT COUNT(*) FROM shr_sprint WHERE uuid = 'b6000000-0000-4000-8000-000000000001'"}
      changes:
        - insert:
            tableName: shr_sprint
            columns:
              - column: {name: uuid, value: b6000000-0000-4000-8000-000000000001}
              - column: {name: id_proyecto, valueComputed: "(SELECT id FROM shr_proyecto WHERE prefijo = 'SHI')"}
              - column: {name: nombre, value: "Sprint 1"}
              - column: {name: inicio, valueDate: "2026-12-01"}
              - column: {name: fin, valueDate: "2026-12-14"}
              - column: {name: estado, value: PLANIFICADO}
      rollback:
        - delete: {tableName: shr_sprint, where: "uuid = 'b6000000-0000-4000-8000-000000000001'"}
