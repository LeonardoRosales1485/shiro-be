        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM auth_roles WHERE nombre = 'ADMIN' AND id_empresa IS NULL
      changes:
        - insert:
            tableName: auth_roles
            columns:
              - column:
                  name: nombre
                  value: ADMIN
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 90000000-0000-4000-8000-000000000102
              - column:
                  name: por_defecto
                  valueNumeric: 0
      rollback:
        - delete:
            tableName: auth_roles
            where: uuid = '90000000-0000-4000-8000-000000000102'

  - changeSet:
      id: 2026-11-18-insert-roles-de-usuarios-seed-3
      author: shiro
      comment: "Crea el rol CLIENTE, sin permisos: es el actor sin permiso de las pruebas de contrato"
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM auth_roles WHERE nombre = 'CLIENTE' AND id_empresa IS NULL
      changes:
        - insert:
            tableName: auth_roles
            columns:
              - column:
                  name: nombre
                  value: CLIENTE
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 90000000-0000-4000-8000-000000000009
              - column:
                  name: por_defecto
                  valueNumeric: 0
      rollback:
        - delete:
            tableName: auth_roles
            where: uuid = '90000000-0000-4000-8000-000000000009'

  - changeSet:
      id: 2026-11-18-insert-roles-de-usuarios-seed-4
      author: shiro
      comment: "Asigna el rol ADMIN al usuario demo"
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM auth_usuarios_roles WHERE uuid = '90000000-0000-4000-8000-000000000111'
      changes:
        - insert:
            tableName: auth_usuarios_roles
            columns:
              - column:
                  name: uuid
                  value: 90000000-0000-4000-8000-000000000111
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: id_usuario
                  valueComputed: (SELECT id FROM auth_usuarios WHERE nombre_de_usuario = 'demo')
              - column:
                  name: id_rol
                  valueComputed: (SELECT id FROM auth_roles WHERE nombre = 'ADMIN' AND id_empresa IS NULL)
      rollback:
        - delete:
            tableName: auth_usuarios_roles
            where: uuid = '90000000-0000-4000-8000-000000000111'

  - changeSet:
      id: 2026-11-18-insert-roles-de-usuarios-seed-5
