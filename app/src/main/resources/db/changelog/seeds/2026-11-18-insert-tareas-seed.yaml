# Seeds de tareas (T1.3): SHI-1 en el tablero principal del proyecto Shiro, en "Por hacer", informada por el usuario
# demo. Deja el contador del proyecto en 1.
databaseChangeLog:
  - changeSet:
      id: 2026-11-18-insert-tareas-seed-1
      author: shiro
      comment: "Crea la tarea SHI-1 y avanza el contador del proyecto Shiro"
      context: "@seed"
      preConditions:
        onFail: MARK_RAN
        sqlCheck: {expectedResult: 0, sql: "SELECT COUNT(*) FROM shr_tarea WHERE uuid = 'b3000000-0000-4000-8000-000000000001'"}
      changes:
        - insert:
            tableName: shr_tarea
            columns:
              - column: {name: uuid, value: b3000000-0000-4000-8000-000000000001}
              - column: {name: id_proyecto, valueComputed: "(SELECT id FROM shr_proyecto WHERE prefijo = 'SHI')"}
              - column: {name: id_tablero, valueComputed: "(SELECT id FROM shr_tablero WHERE uuid = 'b2000000-0000-4000-8000-000000000001')"}
              - column: {name: numero, valueNumeric: 1}
              - column: {name: clave, value: SHI-1}
              - column: {name: id_tipo_tarea, valueComputed: "(SELECT id FROM shr_tipo_tarea WHERE codigo = 'TAREA')"}
              - column: {name: id_estado, valueComputed: "(SELECT id FROM shr_estado WHERE uuid = 'a2000000-0000-4000-8000-000000000011')"}
              - column: {name: titulo, value: "Definir el tablero principal de Shiro"}
              - column: {name: descripcion, value: "Primera tarea de ejemplo del proyecto."}
              - column: {name: id_informante, valueComputed: "(SELECT id FROM auth_usuarios WHERE uuid = '90000000-0000-4000-8000-000000000002')"}
              - column: {name: prioridad, value: MEDIA}
        - update:
            tableName: shr_proyecto
            columns:
              - column: {name: ultimo_numero, valueNumeric: 1}
            where: "prefijo = 'SHI'"
      rollback:
        - delete: {tableName: shr_tarea, where: "uuid = 'b3000000-0000-4000-8000-000000000001'"}
        - update:
            tableName: shr_proyecto
            columns:
              - column: {name: ultimo_numero, valueNumeric: 0}
            where: "prefijo = 'SHI'"
