# Master del proyecto. Incluye, en orden, el schema de cada modulo del Core que este proyecto usa
# y despues el schema propio.
#
# Para dejar de usar un modulo del Core se borra su dependencia en app/pom.xml y su include de aca.
# Shiro usa core-monoempresa (auth_usuarios_roles): los grupos son roles directos del usuario, sin empresas.
databaseChangeLog:
  - include:
      file: db/changelog/core-identity.yaml
  - include:
      file: db/changelog/core-monoempresa.yaml
  - include:
      file: db/changelog/core-protocolo-jwt.yaml
  - include:
      file: db/changelog/core-protocolo-apikey.yaml
  - include:
      file: changes/2026-07-06-create-app-schema.yaml
