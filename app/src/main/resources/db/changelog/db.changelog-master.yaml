      relativeToChangelogFile: true
  - include:
      file: changes/2026-10-09-renombrar-auditoria-configuraciones.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/2026-10-09-restaurar-not-null-configuraciones.yaml
      relativeToChangelogFile: true
  - include:
