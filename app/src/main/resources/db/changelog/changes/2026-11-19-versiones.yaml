# Versiones (T5.3): versiones del proyecto y la asignacion de tareas (una tarea puede estar en varias).
databaseChangeLog:
  - changeSet:
      id: 2026-11-19-versiones-1
      author: shiro
      comment: "Crea shr_version"
      changes:
        - createTable:
            tableName: shr_version
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: uuid, type: CHAR(36), constraints: {nullable: false, unique: true}}
              - column: {name: status, type: TINYINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: id_proyecto, type: BIGINT, constraints: {nullable: false}}
              - column: {name: nombre, type: VARCHAR(60), constraints: {nullable: false}}
              - column: {name: estado, type: VARCHAR(15), defaultValue: SIN_PUBLICAR, constraints: {nullable: false}}
              - column: {name: fecha_de_publicacion, type: DATE}
              - column: {name: changelog, type: TEXT}
              - column: {name: id_operacion_archivo, type: BIGINT}
              - column: {name: id_usuario_de_creacion, type: BIGINT}
              - column: {name: id_usuario_de_actualizacion, type: BIGINT}
              - column: {name: id_usuario_de_borrado, type: BIGINT}
              - column: {name: fecha_de_creacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_actualizacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_borrado, type: TIMESTAMP}
        - addForeignKeyConstraint:
            baseTableName: shr_version
            baseColumnNames: id_proyecto
            referencedTableName: shr_proyecto
            referencedColumnNames: id
            constraintName: fk_shr_version_proyecto
        - addForeignKeyConstraint:
            baseTableName: shr_version
            baseColumnNames: id_operacion_archivo
            referencedTableName: shr_operacion_archivo
            referencedColumnNames: id
            constraintName: fk_shr_version_operacion_archivo
        - sql:
            comment: "Estado acotado"
            sql: "ALTER TABLE shr_version ADD CONSTRAINT ck_shr_version_estado CHECK (estado IN ('SIN_PUBLICAR', 'PUBLICADA'))"
      rollback:
        - dropTable:
            tableName: shr_version

  - changeSet:
      id: 2026-11-19-versiones-2
      author: shiro
      comment: "Crea shr_tarea_version"
      changes:
        - createTable:
            tableName: shr_tarea_version
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: uuid, type: CHAR(36), constraints: {nullable: false, unique: true}}
              - column: {name: status, type: TINYINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: id_tarea, type: BIGINT, constraints: {nullable: false}}
              - column: {name: id_version, type: BIGINT, constraints: {nullable: false}}
              - column: {name: id_operacion_archivo, type: BIGINT}
              - column: {name: id_usuario_de_creacion, type: BIGINT}
              - column: {name: id_usuario_de_actualizacion, type: BIGINT}
              - column: {name: id_usuario_de_borrado, type: BIGINT}
              - column: {name: fecha_de_creacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_actualizacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_borrado, type: TIMESTAMP}
        - addForeignKeyConstraint:
            baseTableName: shr_tarea_version
            baseColumnNames: id_tarea
            referencedTableName: shr_tarea
            referencedColumnNames: id
            constraintName: fk_shr_tarea_version_tarea
        - addForeignKeyConstraint:
            baseTableName: shr_tarea_version
            baseColumnNames: id_version
            referencedTableName: shr_version
            referencedColumnNames: id
            constraintName: fk_shr_tarea_version_version
        - createIndex:
            tableName: shr_tarea_version
            indexName: ix_shr_tarea_version_version
            columns:
              - column: {name: id_version}
        - createIndex:
            tableName: shr_tarea_version
            indexName: ix_shr_tarea_version_tarea
            columns:
              - column: {name: id_tarea}
      rollback:
        - dropTable:
            tableName: shr_tarea_version
