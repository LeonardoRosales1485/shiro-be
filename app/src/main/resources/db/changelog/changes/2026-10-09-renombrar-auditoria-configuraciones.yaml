# Pasa a espanol las columnas de auditoria de configuraciones (glosario de renombres, ticket 02):
# id_user_* -> id_usuario_de_*, date_* -> fecha_de_*. La entidad base (EntidadBase) ya usa los nombres nuevos.
databaseChangeLog:
  - changeSet:
      id: 2026-10-09-renombrar-auditoria-configuraciones-1
      author: TaielMG
      comment: Renombra la columna de auditoria id_user_created de configuraciones a id_usuario_de_creacion
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: configuraciones
          columnName: id_user_created
      changes:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN id_user_created TO id_usuario_de_creacion
      rollback:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN id_usuario_de_creacion TO id_user_created

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-configuraciones-2
      author: TaielMG
      comment: Renombra la columna de auditoria id_user_updated de configuraciones a id_usuario_de_actualizacion
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: configuraciones
          columnName: id_user_updated
      changes:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN id_user_updated TO id_usuario_de_actualizacion
      rollback:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN id_usuario_de_actualizacion TO id_user_updated

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-configuraciones-3
      author: TaielMG
      comment: Renombra la columna de auditoria id_user_deleted de configuraciones a id_usuario_de_borrado
