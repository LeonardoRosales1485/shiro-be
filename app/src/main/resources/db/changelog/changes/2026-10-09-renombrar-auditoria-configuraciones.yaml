        onFail: MARK_RAN
        columnExists:
          tableName: configuraciones
          columnName: id_user_deleted
      changes:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN id_user_deleted TO id_usuario_de_borrado
      rollback:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN id_usuario_de_borrado TO id_user_deleted

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-configuraciones-4
      author: TaielMG
      comment: Renombra la columna de auditoria date_created de configuraciones a fecha_de_creacion
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: configuraciones
          columnName: date_created
      changes:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN date_created TO fecha_de_creacion
      rollback:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN fecha_de_creacion TO date_created

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-configuraciones-5
      author: TaielMG
      comment: Renombra la columna de auditoria date_updated de configuraciones a fecha_de_actualizacion
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: configuraciones
          columnName: date_updated
      changes:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN date_updated TO fecha_de_actualizacion
      rollback:
        - sql:
            sql: ALTER TABLE configuraciones RENAME COLUMN fecha_de_actualizacion TO date_updated

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-configuraciones-6
      author: TaielMG
      comment: Renombra la columna de auditoria date_deleted de configuraciones a fecha_de_borrado
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: configuraciones
