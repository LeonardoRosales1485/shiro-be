# Catalogos de Shiro (T1.1): tipos de tablero, estados por tablero y tipos de tarea, con sus datos obligatorios.
# Son datos de produccion, no seeds: sin ellos no se puede crear un proyecto ni una tarea. Los uuid son fijos para que
# el catalogo sea el mismo en todos los ambientes. Estados y "terminado": seccion 4 y adenda 3 del DAF.
databaseChangeLog:
  - changeSet:
      id: 2026-11-18-catalogos-1
      author: shiro
      comment: "Crea shr_tipo_tablero"
      changes:
        - createTable:
            tableName: shr_tipo_tablero
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: codigo
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: orden
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: id_usuario_de_creacion
                  type: BIGINT
              - column:
                  name: id_usuario_de_actualizacion
                  type: BIGINT
              - column:
                  name: id_usuario_de_borrado
                  type: BIGINT
              - column:
                  name: fecha_de_creacion
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: fecha_de_actualizacion
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: fecha_de_borrado
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: shr_tipo_tablero
            columnNames: codigo
            constraintName: uk_shr_tipo_tablero_codigo
      rollback:
        - dropTable:
            tableName: shr_tipo_tablero

