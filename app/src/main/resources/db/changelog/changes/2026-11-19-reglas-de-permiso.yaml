# Reglas de permiso por recurso (T2.3 y Spec 2): sujeto (grupo o usuario), recurso (proyecto o tablero), nivel y
# efecto. Los checks garantizan un solo sujeto y un solo recurso, segun su tipo.
databaseChangeLog:
  - changeSet:
      id: 2026-11-19-reglas-de-permiso-1
      author: shiro
      comment: "Crea shr_regla_permiso"
      changes:
        - createTable:
            tableName: shr_regla_permiso
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: uuid, type: CHAR(36), constraints: {nullable: false, unique: true}}
              - column: {name: status, type: TINYINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: tipo_sujeto, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: id_rol, type: BIGINT}
              - column: {name: id_usuario, type: BIGINT}
              - column: {name: tipo_recurso, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: id_proyecto, type: BIGINT}
              - column: {name: id_tablero, type: BIGINT}
              - column: {name: nivel, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: efecto, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: id_operacion_archivo, type: BIGINT}
              - column: {name: id_usuario_de_creacion, type: BIGINT}
              - column: {name: id_usuario_de_actualizacion, type: BIGINT}
              - column: {name: id_usuario_de_borrado, type: BIGINT}
              - column: {name: fecha_de_creacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_actualizacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_borrado, type: TIMESTAMP}
        - addForeignKeyConstraint:
            baseTableName: shr_regla_permiso
            baseColumnNames: id_rol
            referencedTableName: auth_roles
            referencedColumnNames: id
            constraintName: fk_shr_regla_permiso_rol
        - addForeignKeyConstraint:
            baseTableName: shr_regla_permiso
            baseColumnNames: id_usuario
            referencedTableName: auth_usuarios
            referencedColumnNames: id
            constraintName: fk_shr_regla_permiso_usuario
        - addForeignKeyConstraint:
            baseTableName: shr_regla_permiso
            baseColumnNames: id_proyecto
            referencedTableName: shr_proyecto
            referencedColumnNames: id
            constraintName: fk_shr_regla_permiso_proyecto
        - addForeignKeyConstraint:
            baseTableName: shr_regla_permiso
            baseColumnNames: id_tablero
            referencedTableName: shr_tablero
            referencedColumnNames: id
            constraintName: fk_shr_regla_permiso_tablero
        - addForeignKeyConstraint:
            baseTableName: shr_regla_permiso
            baseColumnNames: id_operacion_archivo
            referencedTableName: shr_operacion_archivo
            referencedColumnNames: id
            constraintName: fk_shr_regla_permiso_operacion_archivo
        - sql:
            comment: "Valores acotados y un solo sujeto y recurso segun su tipo"
            sql: >-
              ALTER TABLE shr_regla_permiso ADD CONSTRAINT ck_shr_regla_permiso_sujeto CHECK
              ((tipo_sujeto = 'ROL' AND id_rol IS NOT NULL AND id_usuario IS NULL)
              OR (tipo_sujeto = 'USUARIO' AND id_usuario IS NOT NULL AND id_rol IS NULL));
              ALTER TABLE shr_regla_permiso ADD CONSTRAINT ck_shr_regla_permiso_recurso CHECK
              ((tipo_recurso = 'PROYECTO' AND id_proyecto IS NOT NULL AND id_tablero IS NULL)
              OR (tipo_recurso = 'TABLERO' AND id_tablero IS NOT NULL AND id_proyecto IS NULL));
              ALTER TABLE shr_regla_permiso ADD CONSTRAINT ck_shr_regla_permiso_nivel CHECK (nivel IN ('VER', 'EDITAR', 'ARCHIVAR'));
              ALTER TABLE shr_regla_permiso ADD CONSTRAINT ck_shr_regla_permiso_efecto CHECK (efecto IN ('PERMITIR', 'NEGAR'))
        - createIndex:
            tableName: shr_regla_permiso
            indexName: ix_shr_regla_permiso_usuario
            columns:
              - column: {name: id_usuario}
        - createIndex:
            tableName: shr_regla_permiso
            indexName: ix_shr_regla_permiso_rol
            columns:
              - column: {name: id_rol}
      rollback:
        - dropTable:
            tableName: shr_regla_permiso
