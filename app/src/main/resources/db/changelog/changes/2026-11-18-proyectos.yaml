# Proyectos y sus tableros (T1.2). El prefijo es unico sin filtrar por status: el de un proyecto archivado queda
# reservado (adenda 3 del DAF). ultimo_numero lo avanza el alta de tareas con bloqueo de fila (T1.3).
databaseChangeLog:
  - changeSet:
      id: 2026-11-18-proyectos-1
      author: shiro
      comment: "Crea shr_proyecto"
      changes:
        - createTable:
            tableName: shr_proyecto
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: uuid, type: CHAR(36), constraints: {nullable: false, unique: true}}
              - column: {name: status, type: TINYINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: nombre, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: prefijo, type: VARCHAR(6), constraints: {nullable: false}}
              - column: {name: descripcion, type: TEXT}
              - column: {name: ultimo_numero, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: id_usuario_de_creacion, type: BIGINT}
              - column: {name: id_usuario_de_actualizacion, type: BIGINT}
              - column: {name: id_usuario_de_borrado, type: BIGINT}
              - column: {name: fecha_de_creacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_actualizacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_borrado, type: TIMESTAMP}
        - addUniqueConstraint:
            tableName: shr_proyecto
            columnNames: prefijo
            constraintName: uk_shr_proyecto_prefijo
      rollback:
        - dropTable:
            tableName: shr_proyecto

  - changeSet:
      id: 2026-11-18-proyectos-2
      author: shiro
      comment: "Crea shr_tablero: un tablero por tipo en cada proyecto"
      changes:
        - createTable:
            tableName: shr_tablero
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: uuid, type: CHAR(36), constraints: {nullable: false, unique: true}}
              - column: {name: status, type: TINYINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: id_proyecto, type: BIGINT, constraints: {nullable: false}}
              - column: {name: id_tipo_tablero, type: BIGINT, constraints: {nullable: false}}
              - column: {name: id_usuario_de_creacion, type: BIGINT}
              - column: {name: id_usuario_de_actualizacion, type: BIGINT}
              - column: {name: id_usuario_de_borrado, type: BIGINT}
              - column: {name: fecha_de_creacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_actualizacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_borrado, type: TIMESTAMP}
        - addForeignKeyConstraint:
            baseTableName: shr_tablero
            baseColumnNames: id_proyecto
            referencedTableName: shr_proyecto
            referencedColumnNames: id
            constraintName: fk_shr_tablero_proyecto
        - addForeignKeyConstraint:
            baseTableName: shr_tablero
            baseColumnNames: id_tipo_tablero
            referencedTableName: shr_tipo_tablero
            referencedColumnNames: id
            constraintName: fk_shr_tablero_tipo_tablero
        - addUniqueConstraint:
            tableName: shr_tablero
            columnNames: id_proyecto, id_tipo_tablero
            constraintName: uk_shr_tablero_proyecto_tipo
      rollback:
        - dropTable:
            tableName: shr_tablero
