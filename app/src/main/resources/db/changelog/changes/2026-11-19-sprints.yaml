# Sprints (T5.2): uno activo por proyecto (indice unico parcial) y el sprint de cada tarea.
databaseChangeLog:
  - changeSet:
      id: 2026-11-19-sprints-1
      author: shiro
      comment: "Crea shr_sprint"
      changes:
        - createTable:
            tableName: shr_sprint
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: uuid, type: CHAR(36), constraints: {nullable: false, unique: true}}
              - column: {name: status, type: TINYINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: id_proyecto, type: BIGINT, constraints: {nullable: false}}
              - column: {name: nombre, type: VARCHAR(120), constraints: {nullable: false}}
              - column: {name: inicio, type: DATE, constraints: {nullable: false}}
              - column: {name: fin, type: DATE, constraints: {nullable: false}}
              - column: {name: estado, type: VARCHAR(15), defaultValue: PLANIFICADO, constraints: {nullable: false}}
              - column: {name: id_operacion_archivo, type: BIGINT}
              - column: {name: id_usuario_de_creacion, type: BIGINT}
              - column: {name: id_usuario_de_actualizacion, type: BIGINT}
              - column: {name: id_usuario_de_borrado, type: BIGINT}
              - column: {name: fecha_de_creacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_actualizacion, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: fecha_de_borrado, type: TIMESTAMP}
        - addForeignKeyConstraint:
            baseTableName: shr_sprint
            baseColumnNames: id_proyecto
            referencedTableName: shr_proyecto
            referencedColumnNames: id
            constraintName: fk_shr_sprint_proyecto
        - addForeignKeyConstraint:
            baseTableName: shr_sprint
            baseColumnNames: id_operacion_archivo
            referencedTableName: shr_operacion_archivo
            referencedColumnNames: id
            constraintName: fk_shr_sprint_operacion_archivo
        - sql:
            comment: "Estado acotado y un solo sprint activo por proyecto"
            sql: >-
              ALTER TABLE shr_sprint ADD CONSTRAINT ck_shr_sprint_estado CHECK (estado IN ('PLANIFICADO', 'ACTIVO', 'CERRADO'));
              CREATE UNIQUE INDEX ux_shr_sprint_activo ON shr_sprint (id_proyecto) WHERE estado = 'ACTIVO' AND status = 0
      rollback:
        - dropTable:
            tableName: shr_sprint

  - changeSet:
      id: 2026-11-19-sprints-2
      author: shiro
      comment: "Agrega id_sprint a shr_tarea"
      changes:
        - addColumn:
            tableName: shr_tarea
            columns:
              - column: {name: id_sprint, type: BIGINT}
        - addForeignKeyConstraint:
            baseTableName: shr_tarea
            baseColumnNames: id_sprint
            referencedTableName: shr_sprint
            referencedColumnNames: id
            constraintName: fk_shr_tarea_sprint
        - createIndex:
            tableName: shr_tarea
            indexName: ix_shr_tarea_sprint
            columns:
              - column: {name: id_sprint}
      rollback:
        - dropColumn: {tableName: shr_tarea, columnName: id_sprint}
