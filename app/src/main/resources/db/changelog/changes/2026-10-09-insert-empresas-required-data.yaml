# Reemplaza a los changesets de datos requeridos que nombraban las tablas companies, auth_users_companies y
# auth_user_company_roles o sus columnas en ingles (name, code, path, description, user_id, company_id,
# user_company_role_id, role_id). core-multiempresa las renombra a empresas, auth_usuarios_empresas y
# auth_usuarios_empresas_roles (glosario, ticket 07) antes de que corra el schema del proyecto, asi que en una base
# nueva esos changesets ya no podian correr. Corre al final del master, en el mismo orden relativo que los originales:
# empresas Sistema y BlueOpenData, roles base SYSADMIN y ADMIN, empresa del usuario sysadmin y su rol SYSADMIN.
# En las bases donde los originales ya corrieron, las filas existen y estos quedan MARK_RAN.
#
# Reemplazos (original -> nuevo). Los archivos 2026-07-06-insert-required-data.yaml y
# 2026-10-09-insert-roles-base-required-data.yaml quedaron sin changesets y se borraron:
# - 2026-07-06-insert-required-data-1 -> 2026-10-09-insert-empresas-required-data-1
# - 2026-07-06-insert-required-data-1b -> 2026-10-09-insert-empresas-required-data-2
# - 2026-07-06-insert-required-data-2 -> 2026-10-09-insert-empresas-required-data-3
# - 2026-10-09-insert-roles-base-required-data-1 -> 2026-10-09-insert-empresas-required-data-4
# - 2026-10-09-insert-roles-base-required-data-2 -> 2026-10-09-insert-empresas-required-data-5
# - 2026-10-09-insert-usuario-sysadmin-required-data-2 -> 2026-10-09-insert-empresas-required-data-6
# - 2026-10-09-insert-usuario-sysadmin-required-data-3 -> 2026-10-09-insert-empresas-required-data-7
databaseChangeLog:
  - changeSet:
      id: 2026-10-09-insert-empresas-required-data-1
      author: TaielMG
      comment: Crea empresa Sistema para roles globales
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM empresas WHERE uuid = '1'
      changes:
        - insert:
            tableName: empresas
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: nombre
                  value: Sistema
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: '1'
              - column:
                  name: codigo
                  value: system
              - column:
                  name: ruta
                  value: system
              - column:
                  name: descripcion
                  value: Empresa interna para roles globales
      rollback:
        - delete:
            tableName: empresas
            where: uuid = '1'

  - changeSet:
      id: 2026-10-09-insert-empresas-required-data-2
      author: TaielMG
      comment: PostgreSQL no avanza la secuencia al insertar id explicito; se sincroniza para que el siguiente insert de empresas no choque
      dbms: postgresql
      changes:
        - sql:
            sql: SELECT setval(pg_get_serial_sequence('empresas', 'id'), (SELECT MAX(id) FROM empresas))

  - changeSet:
      id: 2026-10-09-insert-empresas-required-data-3
      author: TaielMG
      comment: Crea empresa BlueOpenData por defecto
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM empresas WHERE uuid = '2'
      changes:
        - insert:
            tableName: empresas
            columns:
              - column:
                  name: nombre
                  value: BlueOpenData
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: '2'
              - column:
                  name: codigo
                  value: blueopendata
              - column:
                  name: ruta
                  value: blueopendata
              - column:
                  name: descripcion
                  value: Empresa operativa por defecto
      rollback:
        - delete:
            tableName: empresas
            where: uuid = '2'

  - changeSet:
      id: 2026-10-09-insert-empresas-required-data-4
      author: TaielMG
      comment: Crea rol base SYSADMIN en la empresa Sistema
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM auth_roles WHERE nombre = 'SYSADMIN' AND id_empresa = (SELECT id FROM empresas WHERE uuid = '1')
      changes:
        - insert:
            tableName: auth_roles
            columns:
              - column:
                  name: nombre
                  value: SYSADMIN
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 20000000-0000-4000-8000-000000000001
              - column:
                  name: por_defecto
                  valueNumeric: 0
              - column:
                  name: id_empresa
                  valueComputed: (SELECT id FROM empresas WHERE uuid = '1')
      rollback:
        - delete:
            tableName: auth_roles
            where: uuid = '20000000-0000-4000-8000-000000000001'

  - changeSet:
      id: 2026-10-09-insert-empresas-required-data-5
      author: TaielMG
      comment: Crea rol base ADMIN en la empresa Sistema
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM auth_roles WHERE nombre = 'ADMIN' AND id_empresa = (SELECT id FROM empresas WHERE uuid = '1')
      changes:
        - insert:
            tableName: auth_roles
            columns:
              - column:
                  name: nombre
                  value: ADMIN
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 20000000-0000-4000-8000-000000000002
              - column:
                  name: por_defecto
                  valueNumeric: 1
              - column:
                  name: id_empresa
                  valueComputed: (SELECT id FROM empresas WHERE uuid = '1')
      rollback:
        - delete:
            tableName: auth_roles
            where: uuid = '20000000-0000-4000-8000-000000000002'

  - changeSet:
      id: 2026-10-09-insert-empresas-required-data-6
      author: TaielMG
      comment: Asocia el usuario sysadmin a la empresa Sistema
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: >-
            SELECT COUNT(*) FROM auth_usuarios_empresas ue
            JOIN auth_usuarios u ON u.id = ue.id_usuario
            JOIN empresas e ON e.id = ue.id_empresa
            WHERE u.nombre_de_usuario = 'sysadmin' AND e.uuid = '1'
      changes:
        - insert:
            tableName: auth_usuarios_empresas
            columns:
              - column:
                  name: status
                  valueNumeric: 0
              - column:
                  name: uuid
                  value: 40000000-0000-4000-8000-000000000001
              - column:
                  name: id_usuario
                  valueComputed: (SELECT id FROM auth_usuarios WHERE nombre_de_usuario = 'sysadmin')
              - column:
                  name: id_empresa
                  valueComputed: (SELECT id FROM empresas WHERE uuid = '1')
      rollback:
        - delete:
            tableName: auth_usuarios_empresas
            where: uuid = '40000000-0000-4000-8000-000000000001'

  - changeSet:
      id: 2026-10-09-insert-empresas-required-data-7
      author: TaielMG
      comment: Asigna el rol SYSADMIN al usuario sysadmin en la empresa Sistema
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: >-
            SELECT COUNT(*) FROM auth_usuarios_empresas_roles uer
            JOIN auth_usuarios_empresas ue ON ue.id = uer.id_usuario_empresa
            JOIN auth_usuarios u ON u.id = ue.id_usuario
            JOIN auth_roles r ON r.id = uer.id_rol
            WHERE u.nombre_de_usuario = 'sysadmin' AND r.uuid = '20000000-0000-4000-8000-000000000001'
      changes:
        - insert:
            tableName: auth_usuarios_empresas_roles
            columns:
              - column:
                  name: id_usuario_empresa
                  valueComputed: >-
                    (SELECT ue.id FROM auth_usuarios_empresas ue
                     JOIN auth_usuarios u ON u.id = ue.id_usuario
                     WHERE u.nombre_de_usuario = 'sysadmin')
              - column:
                  name: id_rol
                  valueComputed: (SELECT id FROM auth_roles WHERE uuid = '20000000-0000-4000-8000-000000000001')
      rollback:
        - delete:
            tableName: auth_usuarios_empresas_roles
            where: >-
              id_usuario_empresa IN (
                SELECT ue.id FROM auth_usuarios_empresas ue
                JOIN auth_usuarios u ON u.id = ue.id_usuario
                WHERE u.nombre_de_usuario = 'sysadmin'
              )
              AND id_rol IN (
                SELECT id FROM auth_roles WHERE uuid = '20000000-0000-4000-8000-000000000001'
              )
