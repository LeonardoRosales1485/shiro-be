# Profile "test": lo activa TestConBaseDeDatos (core-test) en las pruebas de contrato y en los tests con base.
# Obligatorio para core-test: spring.liquibase (master + seeds), spring.datasource.driver-class-name y
# spring.jpa (dialecto PostgreSQL, ddl-auto=validate, open-in-view=false); la url, el usuario y la clave del
# datasource los registra TestConBaseDeDatos. auth.protocolos debe incluir "tokens" (los actores de
# ActoresDePrueba se autentican con los tokens de acceso de los seeds). El resto son las properties que la
# aplicacion exige para arrancar.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

spring:
  # Servidor MCP como en servidor: Streamable HTTP sin estado en /api/mcp (spec, Spec 4)
  ai:
    mcp:
      server:
        name: shiro
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
  # Liquibase corre el master real con los seeds (contexto seed) sobre un PostgreSQL 18 embebido
  # (TestConBaseDeDatos): la base queda identica a la que arma Liquibase en local. La url, el usuario y la
  # clave del datasource los registra TestConBaseDeDatos al levantar el PostgreSQL embebido.
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-seed.yaml
    contexts: seed
    # Usuario de la aplicacion sin DELETE sobre shr_ (T0.3). Valores solo de prueba
    parameters:
      shiro_usuario_app: shiro_app
      shiro_contrasena_app: prueba-app
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
    show-sql: false
  jackson:
    time-zone: America/Argentina/Buenos_Aires
    locale: es_AR
  mail:
    host: localhost
    port: 1025
    username: test
    password: test

front:
  url: http://localhost:4200

captcha:
  secreto: test-captcha-secret
  habilitado: false

auth:
  protocolos: basic,jwt,tokens
jwt:
  secreto: testSecretKeyTestSecretKeyTestSecretKeyTestSecretKey

server:
  servlet:
    context-path: /api

core:
  protocolo:
    jwt:
      ruta: usuario
    apikey:
      ruta: usuario
  identity:
    usuario-inicial:
      nombre-de-usuario: sysadmin
      contrasena: 123
# Ingreso con Google (T2.2): configuracion de las pruebas; las claves publicas son un doble y no se llama a Google
shiro:
  google:
    client-id: shiro-pruebas.apps.googleusercontent.com
    dominio: example.com
    comprobar-al-iniciar: false
  # Importador de Jira (F4): frase de cifrado solo de prueba y ejecucion en el hilo del request (para verificar y
  # revertir en la transaccion de la prueba)
  cifrado:
    frase: frase-de-cifrado-solo-para-pruebas
  importacion:
    sincronica: true
  # El Jira simulado de las pruebas corre en 127.0.0.1 por http; en servidor solo se aceptan sitios https de Atlassian
  jira:
    hosts-de-prueba: 127.0.0.1
