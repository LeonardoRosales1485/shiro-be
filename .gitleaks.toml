# Configuracion de gitleaks (adenda de implementacion 1: ningun secreto en el repositorio).
# Parte de las reglas por defecto y solo agrega excepciones con motivo.
[extend]
useDefault = true

[[allowlists]]
description = "JWT de ejemplo firmados con la clave de prueba: los genera la suite en el contrato de la API y el doble de AuthJwtService"
paths = [
  '''^docs/api/''',
  '''^app/src/test/java/com/blue/open/Code/Usuario/AuthJwtServiceDePrueba\.java$''',
]

[[allowlists]]
description = "Tokens de acceso de los seeds de ejemplo (contexto seed, solo local y pruebas; en servidor no se cargan): aparecen en los ejemplos de curl de la documentacion y en las pruebas"
regexTarget = "line"
regexes = ['''(sysadmin|demo|cliente)-access-token''']
